events {
    worker_connections 1024;
}

http {
    # Rate limiting zone, matching BeingDB's own recommended nginx config.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream beingdb {
        server beingdb:8080;
    }

    upstream beingdb_mcp {
        server mcp:3000;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/beingdb_access.log;
        error_log /var/log/nginx/beingdb_error.log;

        # MCP endpoint (Streamable HTTP) -- may hold connections open for
        # streamed responses, so buffering is disabled.
        location /mcp {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://beingdb_mcp/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # BeingDB's raw REST API, exposed alongside MCP for direct/debugging access.
        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://beingdb;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}
